name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      # Signs every build with the same key, so a new APK installs over the one
      # already on the tablet. Without these secrets Gradle falls back to a
      # debug key that each runner generates for itself, and Android rejects
      # the upgrade with "App not installed".
      # The secrets context is not dependable in a step-level `if`, so the step
      # always runs and decides for itself; a repository without the key still
      # builds, just with the debug key.
      - name: Write the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with Gradle's debug key, so this APK cannot be installed over an earlier build."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release key in place."
      # The build number becomes the versionCode, so each release supersedes
      # the last instead of every build claiming to be version 1.
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: unicef-school-solar-apk
          path: build/app/outputs/flutter-apk/*.apk

  # Publishes every successful push build as a GitHub Release so the APK has a
  # permanent download link:
  #   https://github.com/<owner>/<repo>/releases/latest/download/unicef-school-solar.apk
  release:
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unicef-school-solar-apk
          path: dist
      - name: Create release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.0-build.${{ github.run_number }}"
          cd dist
          mv app-release.apk unicef-school-solar.apk
          mv app-arm64-v8a-release.apk unicef-school-solar-arm64.apk
          mv app-armeabi-v7a-release.apk unicef-school-solar-armv7.apk
          mv app-x86_64-release.apk unicef-school-solar-x86_64.apk
          sha256sum *.apk > SHA256SUMS.txt
          cd ..
          gh release create "$tag" dist/unicef-school-solar.apk dist/unicef-school-solar-arm64.apk dist/unicef-school-solar-armv7.apk dist/unicef-school-solar-x86_64.apk dist/SHA256SUMS.txt \
            --target "${{ github.sha }}" \
            --title "UNICEF School Solar $tag" \
            --notes "Release APKs built by CI from commit ${{ github.sha }} on branch ${{ github.ref_name }}. Use unicef-school-solar-arm64.apk on modern tablets (most devices), unicef-school-solar-armv7.apk on older 32-bit tablets, or the universal unicef-school-solar.apk if you are unsure of the tablet. Android 7.0+; allow installs from unknown sources. If Android answers \"App not installed\", the copy already on the tablet was signed with a different key: uninstall it, then install this APK."
